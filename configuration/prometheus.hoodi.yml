global:
  scrape_interval: 12s

scrape_configs:
  - job_name: beacon
    static_configs:
      - targets: ["beacon:8080"]

  - job_name: geth
    metrics_path: /debug/metrics/prometheus
    static_configs:
      - targets: ["geth:6065"]

  - job_name: node
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: peer-geo
    static_configs:
      - targets: ["peer-geo-exporter:9101"]

  - job_name: fork-choice
    static_configs:
      - targets: ["fork-choice-recorder:9102"]
